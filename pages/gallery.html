<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var savedTheme = localStorage.getItem('heyyouth_theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Hey Youth!</title>
    <link rel="icon" type="image/webp" href="../assets/img/NEW HEY YOUTH Sep 2025.webp">
    <meta name="description" content="Kumpulan semua kegiatan dan podcast dari Hey Youth!">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,700;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../assets/Style/tailwind.css">
    <link rel="stylesheet" href="../assets/Style/Style.css">
</head>

<body class="lang-en bg-bg text-body font-sans antialiased selection:bg-primary selection:text-white">

    <!-- Navigation Bar -->
    <!-- Navigation Bar (Global Component) -->
    <div id="global-navbar"></div>

    <main class="pt-20">
        <!-- Hero Gallery -->
        <section class="py-16 lg:py-24 bg-surface text-center border-b border-gray-100">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                <h1 class="text-4xl lg:text-5xl font-extrabold text-heading mb-6 font-serif">Hey Youth <span
                        class="text-primary">Gallery</span></h1>
                <p class="text-lg text-body max-w-2xl mx-auto">Kumpulan seluruh momen berharga, kegiatan edukatif, dan
                    episode podcast yang telah kami selenggarakan.</p>
            </div>
        </section>

        <!-- All Activities -->
        <section id="activities" class="py-20 bg-bg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <!-- Section Header with Search Bar -->
                <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-8">
                    <div>
                        <span class="inline-block py-1 px-3 rounded-full bg-primary/10 text-primary text-xs font-bold tracking-wider uppercase mb-3">
                            <span class="lang-id">Dokumentasi & Aksi</span><span class="lang-en">Documentation & Actions</span>
                        </span>
                        <h2 class="text-3xl lg:text-4xl font-extrabold text-heading border-b-2 border-primary/30 pb-3 inline-block font-serif">
                            <span class="lang-id">Semua Kegiatan</span><span class="lang-en">All Activities</span>
                        </h2>
                        <p class="text-sm text-gray-500 mt-2 flex items-center gap-2" id="activity-count-badge">
                            <!-- Dynamic count inserted here -->
                        </p>
                    </div>

                    <!-- Live Search Bar -->
                    <div class="w-full lg:w-96">
                        <div class="search-box-wrapper relative" style="position: relative; display: flex; align-items: center; width: 100%;">
                            <span class="search-box-icon" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #94a3b8; display: flex; align-items: center; justify-content: center; z-index: 10; line-height: 1;">
                                <i class="fas fa-search text-sm"></i>
                            </span>
                            <input type="text" id="activity-search"
                                placeholder="Cari kegiatan, topik, atau sekolah..."
                                autocomplete="off"
                                class="search-box-input w-full bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-sm text-heading placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm"
                                style="width: 100%; padding-left: 44px; padding-right: 40px; padding-top: 12px; padding-bottom: 12px; border-radius: 9999px; box-sizing: border-box;">
                            <button id="activity-search-clear" type="button" aria-label="Clear search"
                                class="search-box-clear hidden"
                                style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3b8; align-items: center; justify-content: center; z-index: 10; line-height: 1;">
                                <i class="fas fa-times-circle text-base hover:text-red-500 transition-colors"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Filter Tags & Active Status -->
                <div class="flex flex-wrap items-center justify-between gap-4 mb-8 pb-4 border-b border-gray-100 dark:border-slate-800">
                    <!-- Category Filters -->
                    <div class="flex flex-wrap gap-2.5" id="activity-filters">
                        <button class="filter-btn active px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all bg-primary text-white shadow-md shadow-blue-500/20" data-category="all">
                            <i class="fas fa-th-large mr-1.5 text-xs"></i>
                            <span class="lang-id">Semua</span><span class="lang-en">All</span>
                        </button>
                        <button class="filter-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all bg-gray-100 hover:bg-gray-200 text-gray-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700" data-category="education">
                            <i class="fas fa-graduation-cap mr-1.5 text-xs"></i>
                            <span class="lang-id">Pendidikan</span><span class="lang-en">Education</span>
                        </button>
                        <button class="filter-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all bg-gray-100 hover:bg-gray-200 text-gray-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700" data-category="community">
                            <i class="fas fa-users mr-1.5 text-xs"></i>
                            <span class="lang-id">Komunitas</span><span class="lang-en">Community</span>
                        </button>
                    </div>

                    <!-- Active Filter Chips / Reset Indicator -->
                    <div id="active-filter-indicators" class="hidden flex items-center gap-2 flex-wrap">
                        <span class="text-xs text-gray-400 font-medium">
                            <span class="lang-id">Filter aktif:</span><span class="lang-en">Active filter:</span>
                        </span>
                        <span id="active-filter-tag" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 dark:bg-blue-950/70 text-primary dark:text-blue-400 text-xs font-bold border border-blue-200 dark:border-blue-900"></span>
                        <button id="btn-reset-filters" type="button" class="inline-flex items-center gap-1 px-2.5 py-1 text-xs text-red-500 hover:text-red-700 dark:hover:text-red-400 font-bold transition-colors">
                            <i class="fas fa-undo-alt text-[10px]"></i>
                            <span class="lang-id">Reset</span><span class="lang-en">Reset</span>
                        </button>
                    </div>
                </div>

                <div id="activity-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                    <!-- Activities will be injected here -->
                </div>
            </div>
        </section>

        <!-- All Podcasts -->
        <section id="podcasts" class="py-20 bg-white dark:bg-slate-900 border-t border-gray-100 dark:border-slate-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-8">
                    <div>
                        <span class="inline-block py-1 px-3 rounded-full bg-green-100 text-green-700 text-xs font-bold tracking-wider uppercase mb-3">
                            <span class="lang-id">Podcast & Audio</span><span class="lang-en">Podcast & Audio</span>
                        </span>
                        <h2 class="text-3xl lg:text-4xl font-extrabold text-heading border-b-2 border-accent/30 pb-3 inline-block font-serif">
                            <span class="lang-id">Semua Podcast</span><span class="lang-en">All Podcasts</span>
                        </h2>
                        <p class="text-sm text-gray-500 mt-2 flex items-center gap-2" id="podcast-count-badge"></p>
                    </div>

                    <!-- Live Search Bar for Podcasts -->
                    <div class="w-full lg:w-96">
                        <div class="search-box-wrapper relative" style="position: relative; display: flex; align-items: center; width: 100%;">
                            <span class="search-box-icon" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #94a3b8; display: flex; align-items: center; justify-content: center; z-index: 10; line-height: 1;">
                                <i class="fas fa-search text-sm"></i>
                            </span>
                            <input type="text" id="podcast-search"
                                placeholder="Cari episode podcast..."
                                autocomplete="off"
                                class="search-box-input w-full bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-sm text-heading placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all shadow-sm"
                                style="width: 100%; padding-left: 44px; padding-right: 40px; padding-top: 12px; padding-bottom: 12px; border-radius: 9999px; box-sizing: border-box;">
                            <button id="podcast-search-clear" type="button" aria-label="Clear podcast search"
                                class="search-box-clear hidden"
                                style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3b8; align-items: center; justify-content: center; z-index: 10; line-height: 1;">
                                <i class="fas fa-times-circle text-base hover:text-red-500 transition-colors"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="podcast-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Podcasts will be injected here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Footer (Global Component) -->
    <div id="global-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/Javascript/supabase-init.js"></script>
    <script src="../assets/Javascript/components.js"></script>
    <script src="../assets/Javascript/Script.js"></script>

    <script src="../assets/Javascript/pages/gallery.js"></script>
</body>

</html>
